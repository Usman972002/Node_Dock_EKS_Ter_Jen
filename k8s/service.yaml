apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: backend
  labels: { app: backend-api }                   # a ServiceMonitor can select this later
spec:
  type: ClusterIP                                # internal only; the ALB talks to pod IPs through the Ingress
  selector: { app: backend-api }                 # endpoints = pods carrying this label
  ports:
    - name: http
      port: 80                                   # port other things call
      targetPort: http                           # the named containerPort (8000)
