apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: backend
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing        # public ALB in the public subnets
    alb.ingress.kubernetes.io/target-type: ip                # register pod IPs directly
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'            # HTTP -> HTTPS
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:<acct>:certificate/<id>   # ACM cert for api.cloudwithusman.online
    alb.ingress.kubernetes.io/healthcheck-path: /api/health  # ALB health probe path
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb                                      # handled by the AWS Load Balancer Controller
  rules:
    - host: api.cloudwithusman.online
      http:
        paths:
          - path: /
            pathType: Prefix                                 # match / and everything below it
            backend:
              service:
                name: backend-svc
                port: { number: 80 }
